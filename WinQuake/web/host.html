<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quake web host test</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ccc; font: 13px system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
  /* 640x480 framebuffer scaled by CSS, nearest-neighbour keeps the software-renderer look */
  #game { width: 960px; max-width: 100%; aspect-ratio: 4 / 3; image-rendering: pixelated; background: #000; outline: none; }
  #bar button { margin-right: 4px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="bar">
    <button id="pause">Pause</button>
    <button id="newgame">New game</button>
    <label>Volume <input id="vol" type="range" min="0" max="100" value="100"></label>
    <label>Sensitivity <input id="sens" type="range" min="1" max="11" step="0.5" value="4"></label>
    <span id="status">loading…</span>
  </div>
</div>
<script type="module">
  // Dev/test host for the Bliss contract (Doc/web.md). Expects quake.js, quake.wasm and
  // pak0.pak next to this page.
  import createQuake from './quake.js';
  const status = document.getElementById('status');
  const canvas = document.getElementById('game');
  window.blissEvents = [];
  const pak = new Uint8Array(await (await fetch('./pak0.pak')).arrayBuffer());
  // window.blissCreate() makes a new instance (create -> dispose -> create tests).
  window.blissCreate = () => createQuake({
    canvas,
    blissWidth: 640, blissHeight: 480,
    locateFile: (name) => './' + name,
    preRun: [(m) => { m.FS.writeFile('/data/id1/pak0.pak', pak); }],
    onBlissEvent(type, json) {
      window.blissEvents.push([type, JSON.parse(json)]);
      status.textContent = type + ' ' + json;
      if (type === 'started') canvas.focus();
    },
    print: (t) => console.log(t),
    printErr: (t) => console.warn(t),
  });
  let M = await window.blissCreate();
  window.Module = M;
  window.blissRecreate = async () => { M._bliss_dispose(); M = await window.blissCreate(); window.Module = M; return true; };
  document.getElementById('pause').onclick = () => {
    if (M._bliss_is_paused()) M._bliss_resume(); else M._bliss_pause();
  };
  document.getElementById('newgame').onclick = () => { M._bliss_new_game(1); canvas.focus(); };
  document.getElementById('vol').oninput = (e) => M._bliss_set_master_volume(+e.target.value);
  document.getElementById('sens').oninput = (e) => M._bliss_set_mouse_sensitivity(+e.target.value);
</script>
</body>
</html>
